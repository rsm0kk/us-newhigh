*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.5;
  -webkit-text-size-adjust:100%;overflow-x:hidden}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--accent)}

header{background:var(--navy);color:#fff;padding:16px 20px 0}
.hrow{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;max-width:1560px;margin:0 auto}
h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.2px}
.sub{color:#c5d3e8;font-size:12.5px;margin-top:4px}
.spacer{flex:1 1 auto}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.hbtn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.22);
  border-radius:8px;padding:6px 11px;font-size:12.5px;cursor:pointer;font-family:inherit}
.hbtn:hover{background:rgba(255,255,255,.22)}
.hbtn:focus-visible{outline:2px solid #9fc6ff;outline-offset:2px}

.kpis{display:flex;gap:10px;flex-wrap:wrap;max-width:1560px;margin:14px auto 0;padding-bottom:14px}
.kpi{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:10px;
  padding:8px 13px;min-width:104px}
.kpi b{display:block;font-size:19px;font-weight:700;font-family:var(--mono);font-variant-numeric:tabular-nums}
.kpi span{display:block;font-size:11.5px;color:#c5d3e8;margin-top:1px}

nav.tabs{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.tabsin{max-width:1560px;margin:0 auto;display:flex;gap:2px;padding:0 12px;overflow-x:auto}
.tab{background:none;border:none;border-bottom:3px solid transparent;color:var(--ink-2);
  padding:11px 14px;font-size:13.5px;cursor:pointer;white-space:nowrap;font-family:inherit}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}

main{max-width:1560px;margin:0 auto;padding:16px 12px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  margin-bottom:16px;overflow:hidden}
.card > h2{margin:0;padding:13px 16px 11px;font-size:14.5px;border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card > h2 .hint{font-weight:400;color:var(--ink-3);font-size:12px}
.cbody{padding:14px 16px}

.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line-soft);
  background:var(--panel-2)}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;
  font-size:12.5px;color:var(--ink-2);cursor:pointer;font-family:inherit;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=search],select{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:6px 10px;color:var(--ink);font-size:12.5px;font-family:inherit;min-width:150px}
input[type=search]:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.count{color:var(--ink-3);font-size:12.5px;margin-left:auto}

.tw{overflow-x:auto;max-height:74vh;overflow-y:auto}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1500px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line-soft);text-align:right;white-space:nowrap;vertical-align:middle}
th{position:sticky;top:0;background:var(--panel-2);z-index:5;font-size:11.5px;color:var(--ink-2);
  font-weight:700;cursor:pointer;user-select:none;border-bottom:1px solid var(--line)}
th:hover{color:var(--accent)}
th .ar{opacity:.35;font-size:9px;margin-left:2px}
th[data-dir] .ar{opacity:1;color:var(--accent)}
td.l,th.l{text-align:left}
tbody tr:hover td{background:var(--accent-soft)}
.tk{font-family:var(--mono);font-weight:700;font-size:12.5px}
.nm{color:var(--ink-2);max-width:230px;overflow:hidden;text-overflow:ellipsis;display:inline-block;
  vertical-align:bottom;white-space:nowrap}
.up{color:var(--up);font-weight:700}
.down{color:var(--down);font-weight:700}
.flat{color:var(--flat)}
.badge{display:inline-block;border-radius:6px;padding:2px 7px;font-size:11.5px;font-weight:700;
  border:1px solid transparent;font-family:var(--mono)}
.b52{background:var(--b52-bg);color:var(--b52-ink);border-color:var(--b52-line)}
.b120{background:var(--b120-bg);color:var(--b120-ink);border-color:var(--b120-line)}
.b60{background:var(--b60-bg);color:var(--b60-ink);border-color:var(--b60-line)}
.b20{background:var(--b20-bg);color:var(--b20-ink);border-color:var(--b20-line)}
.mult{display:inline-block;border-radius:5px;padding:1px 5px;font-size:11px;font-weight:700;margin-left:5px;
  background:var(--warn-bg);color:var(--warn);font-family:var(--mono)}
.sec{color:var(--ink-3);font-size:12px}
.capwarn{color:var(--warn);font-weight:700;cursor:help;margin-left:1px}
.secbig{display:inline-block;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;
  padding:2px 7px;font-size:11.5px;color:var(--ink-2);white-space:nowrap}
/* 사업 설명은 표를 밀지 않게 폭을 고정하고 두 줄까지만 보인다. 전문은 툴팁. */
.biz{max-width:340px;white-space:normal;word-break:keep-all;overflow-wrap:anywhere;
  font-size:11.5px;line-height:1.4;color:var(--ink-2);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note{max-width:360px;min-width:260px;white-space:normal;word-break:keep-all;overflow-wrap:anywhere;color:var(--ink-2);
  font-size:12px;text-align:left;line-height:1.45}
.note[contenteditable="true"]{min-width:180px;background:var(--panel-2);border:1px dashed var(--line);

.note[contenteditable="true"]:focus{outline:2px solid var(--accent);outline-offset:0;background:var(--panel)}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:14px}
.rk h3{margin:0 0 8px;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rk h3 em{font-style:normal;color:var(--ink-3);font-weight:400;font-size:11.5px}
.rk table{min-width:0}
.rk .tw{max-height:none}

.dl{display:grid;grid-template-columns:180px 1fr;gap:6px 14px;font-size:13px}
.dl dt{color:var(--ink-3);font-weight:600}
.dl dd{margin:0;word-break:keep-all;overflow-wrap:anywhere}
.provbox{margin-top:8px;padding:8px 12px;background:#fff4d6;color:#6b4a00;border:1px solid #e0b23c;border-radius:8px;font-size:13px;line-height:1.5}
.warnbox{background:var(--warn-bg);color:var(--warn);border:1px solid currentColor;border-radius:8px;
  padding:10px 13px;font-size:12.5px;margin-bottom:12px;word-break:keep-all}

#chart{width:100%;height:340px;display:block}
#tip{position:fixed;pointer-events:none;z-index:99;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;box-shadow:var(--shadow);padding:9px 11px;font-size:12px;max-width:280px;display:none;
  color:var(--ink)}
#tip b{display:block;font-size:12.5px;margin-bottom:4px}
#tip .row{display:flex;justify-content:space-between;gap:14px}
#tip .row span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700}

@media (max-width:720px){
  .kpi{min-width:88px;padding:7px 10px}
  .kpi b{font-size:16px}
  .grid2{grid-template-columns:1fr}
  .dl{grid-template-columns:1fr;gap:2px 0}
  .dl dt{margin-top:8px}
}
</style>

function paint(){
  // sortD: 1=오름차순, -1=내림차순. 값이 없는 칸은 방향과 무관하게 항상 아래로 보낸다.
  view = filtered().sort(function(a,b){
    var x = a[sortK], y = b[sortK];
    if(typeof x === 'string' || typeof y === 'string')
      return String(x===null||x===undefined?'':x).localeCompare(String(y===null||y===undefined?'':y)) * sortD;
    var xa = (x===null||x===undefined||!isFinite(x)), ya = (y===null||y===undefined||!isFinite(y));
    if(xa && ya) return 0;
    if(xa) return 1;
    if(ya) return -1;
    return (x - y) * sortD;
  });
  Array.prototype.forEach.call(document.querySelectorAll('#htable th'), function(th){
    if(th.dataset.k===sortK){ th.dataset.dir = sortD>0?'asc':'desc'; th.querySelector('.ar').textContent = sortD>0?'▲':'▼'; }
    else { delete th.dataset.dir; th.querySelector('.ar').textContent = '▼'; }
  });
  $('#htable tbody').innerHTML = view.map(function(r){
    return '<tr>' + COLS.map(function(c){ return '<td class="'+(c.l?'l':'')+'">'+c.r(r)+'</td>'; }).join('') + '</tr>';
  }).join('') || '<tr><td class="l" colspan="'+COLS.length+'" style="padding:22px;color:var(--ink-3)">조건에 맞는 종목이 없습니다.</td></tr>';

// ── 산점도 (x: 거래대금 배수 log, y: 등락률) ────────────────────
var PTS = [];
function drawChart(){
  var svg = $('#chart');
  if(!svg || $('#pane-high').hidden) return;
  var W = svg.clientWidth || 900, H = 340;
  // 세로 밴드를 먼저 박는다. TITLE_Y(축 제목) 밴드와 T(플롯 상단) 밴드를 겹치게 두면
  // 맨 위 눈금 라벨이 축 제목을 먹는다.
  var TITLE_Y = 13, L = 62, R = 18, T = 34, B = 46;
  svg.setAttribute('viewBox', '0 0 '+W+' '+H);

  var src = (view.length?view:DATA.highs).filter(function(r){
    return isFinite(r.dvMult) && r.dvMult>0 && isFinite(r.chgPct); });
  if(!src.length){
    svg.innerHTML = '<text x="'+(W/2)+'" y="'+(H/2)+'" text-anchor="middle" fill="var(--ink-3)" font-size="13">'
      + '표시할 데이터가 없습니다</text>';
    PTS = []; return;
  }

  var xs = src.map(function(r){ return Math.log10(r.dvMult); });
  var ys = src.map(function(r){ return r.chgPct; });
  var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
  var y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  x0 = Math.min(x0, -0.31); x1 = Math.max(x1, 0.48);           // 0.5x ~ 3x 는 항상 보이게
  var yPad = Math.max(1, (y1-y0)*0.12); y0 -= yPad; y1 += yPad;
  if(y1-y0 < 2){ y0 -= 1; y1 += 1; }

  var px = function(v){ return L + (Math.log10(v)-x0)/(x1-x0)*(W-L-R); };
  var py = function(v){ return T + (y1-v)/(y1-y0)*(H-T-B); };

  var s = [];
  // 세로 격자 = 배수 눈금
  [0.5,1,2,3,5,10,20,50].forEach(function(m){
    var lx = Math.log10(m);
    if(lx < x0 || lx > x1) return;
    var X = px(m);
    s.push('<line x1="'+X.toFixed(1)+'" y1="'+T+'" x2="'+X.toFixed(1)+'" y2="'+(H-B)+'" stroke="var(--line-soft)" stroke-width="1"/>');
    s.push('<text x="'+X.toFixed(1)+'" y="'+(H-B+17)+'" text-anchor="middle" fill="var(--ink-3)" font-size="11" font-family="var(--mono)">'+m+'x</text>');
  });
  // 가로 격자 = 등락률 눈금 (5칸 고정 — 라벨끼리 절대 겹치지 않게)
  for(var i=0;i<=5;i++){
    var v = y0 + (y1-y0)*i/5, Y = py(v);
    s.push('<line x1="'+L+'" y1="'+Y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+Y.toFixed(1)+'" stroke="var(--line-soft)" stroke-width="1"/>');
    s.push('<text x="'+(L-9)+'" y="'+(Y+4).toFixed(1)+'" text-anchor="end" fill="var(--ink-3)" font-size="11" font-family="var(--mono)">'+v.toFixed(1)+'%</text>');
  }
  // 0% 기준선 · 1배 기준선
  if(y0<0 && y1>0) s.push('<line x1="'+L+'" y1="'+py(0).toFixed(1)+'" x2="'+(W-R)+'" y2="'+py(0).toFixed(1)+'" stroke="var(--ink-3)" stroke-width="1.4" stroke-dasharray="4 3"/>');
  s.push('<line x1="'+px(1).toFixed(1)+'" y1="'+T+'" x2="'+px(1).toFixed(1)+'" y2="'+(H-B)+'" stroke="var(--ink-3)" stroke-width="1.4" stroke-dasharray="4 3"/>');

  // 색을 토큰으로 준다 — 폰 OS 다크에서도 점 색이 따라온다.
  var COLOR = {'52주':'var(--dot52)','120일':'var(--dot120)','60일':'var(--dot60)','20일':'var(--dot20)'};
  PTS = [];
  src.forEach(function(r){
    var X = px(r.dvMult), Y = py(r.chgPct);
    PTS.push({x:X, y:Y, r:r});
    var c = COLOR[r.highLabel] || '#667085';
    s.push('<circle cx="'+X.toFixed(1)+'" cy="'+Y.toFixed(1)+'" r="'+(r.highCount>=3?5.5:4)+'" fill="'+c+'" fill-opacity="'+(r.highCount>=2?0.85:0.5)+'" stroke="'+c+'" stroke-width="1"/>');
  });

  // 축 제목 — 아래 여백 밴드에만 둔다 (눈금 라벨 밴드와 분리)
  s.push('<text x="'+((L+W-R)/2)+'" y="'+(H-7)+'" text-anchor="middle" fill="var(--ink-2)" font-size="11.5">거래대금 / 직전 20세션 중앙값 (로그)</text>');
  s.push('<text x="8" y="'+TITLE_Y+'" fill="var(--ink-2)" font-size="11.5">등락률 (%)</text>');
  s.push('<rect id="hit" x="'+L+'" y="'+T+'" width="'+(W-L-R)+'" height="'+(H-T-B)+'" fill="transparent"/>');
  s.push('<circle id="mk" r="8" fill="none" stroke="var(--accent)" stroke-width="2" style="display:none"/>');
  svg.innerHTML = s.join('');
  bindHover(svg);
}

function bindHover(svg){
  var tip = $('#tip'), mk = svg.querySelector('#mk'), hit = svg.querySelector('#hit');
  if(!hit) return;
  function at(ev){
    var t = (ev.touches && ev.touches[0]) || ev;
    var box = svg.getBoundingClientRect();
    var vb = svg.viewBox.baseVal;
    var sx = vb.width / box.width, sy = vb.height / box.height;
    var mx = (t.clientX - box.left) * sx, my = (t.clientY - box.top) * sy;
    var best = null, bd = Infinity;
    for(var i=0;i<PTS.length;i++){
      var d = (PTS[i].x-mx)*(PTS[i].x-mx) + (PTS[i].y-my)*(PTS[i].y-my);
      if(d < bd){ bd = d; best = PTS[i]; }
    }
    if(!best || bd > 40*40){ hide(); return; }
    mk.setAttribute('cx', best.x); mk.setAttribute('cy', best.y); mk.style.display = '';
    var r = best.r;
    tip.innerHTML = '<b>'+esc(r.ticker)+' · '+esc(r.name)+'</b>'
      + '<div class="row"><span>신고가</span><span>'+esc(r.highs.join(' · '))+'</span></div>'
      + '<div class="row"><span>등락률</span><span class="'+cls(r.chgPct)+'">'+pct(r.chgPct)+'</span></div>'
      + '<div class="row"><span>거래대금</span><span>'+money(r.dollarVol)+'</span></div>'
      + '<div class="row"><span>거래대금 배수</span><span>'+n(r.dvMult,2)+'x</span></div>'
      + '<div class="row"><span>종가</span><span>$'+n(r.close,2)+'</span></div>'
      + '<div class="row"><span>섹터</span><span>'+esc(r.sector)+'</span></div>'
      + '<div class="row" style="margin-top:5px;color:var(--ink-3)"><span>'+esc(M.date)+' 종가 기준</span><span></span></div>';
    tip.style.display = 'block';
    var tw = tip.offsetWidth, th = tip.offsetHeight;
    var lx = t.clientX + 16, ly = t.clientY + 16;
    if(lx + tw > window.innerWidth - 8) lx = t.clientX - tw - 16;
    if(ly + th > window.innerHeight - 8) ly = t.clientY - th - 16;
    tip.style.left = Math.max(8, lx) + 'px';
    tip.style.top = Math.max(8, ly) + 'px';
  }
  function hide(){ tip.style.display = 'none'; if(mk) mk.style.display = 'none'; }
  hit.addEventListener('mousemove', at);
  hit.addEventListener('mouseleave', hide);
  hit.addEventListener('touchstart', function(e){ at(e); }, {passive:true});
  hit.addEventListener('touchmove', function(e){ at(e); }, {passive:true});
  hit.addEventListener('touchend', hide);
}
