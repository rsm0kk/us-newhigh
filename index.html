*{box-sizing:border-box}
html,body{margin:0;padding:0}

nav.tabs{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.tabsin{max-width:1560px;margin:0 auto;display:flex;gap:2px;padding:0 12px;overflow-x:auto}
.tab{background:none;border:none;border-bottom:3px solid transparent;color:var(--ink-2);
  padding:11px 14px;font-size:13.5px;cursor:pointer;white-space:nowrap;font-family:inherit}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}

main{max-width:1560px;margin:0 auto;padding:16px 12px 60px}

.cbody{padding:14px 16px}

  background:var(--panel-2)}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;
  font-size:12.5px;color:var(--ink-2);cursor:pointer;font-family:inherit;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

.count{color:var(--ink-3);font-size:12.5px;margin-left:auto}

<script>
(function(){
'use strict';
var $ = function(s){ return document.querySelector(s); };
var M = DATA.meta;

// ── 숫자 표기 ────────────────────────────────────────────────
function n(v,d){ if(v===null||v===undefined||!isFinite(v)) return '—';
  return Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function pct(v){ if(v===null||v===undefined||!isFinite(v)) return '—';
  return (v>0?'+':'') + n(v,2) + '%'; }
function money(v){ if(!isFinite(v)||v===null) return '—';
  if(v>=1e9) return '$'+n(v/1e9,2)+'B';
  if(v>=1e6) return '$'+n(v/1e6,1)+'M';
  return '$'+n(v,0); }
function cls(v){ return (v>0)?'up':(v<0)?'down':'flat'; }
function esc(s){ return String(s===null||s===undefined?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

var BADGE = { '52주':'b52', '120일':'b120', '60일':'b60', '20일':'b20' };
function highCell(r){
  var h = r.highs.map(function(x){ return '<span class="badge '+BADGE[x]+'">'+x+'</span>'; }).join(' ');
  if(r.highCount>1) h += ' <span class="mult">x'+r.highCount+'</span>';
  return h;
}

// ── 헤더 ─────────────────────────────────────────────────────
$('#subline').textContent = M.date + ' 미국 정규장 마감 · ' + M.basis
  + ' · 창 ' + M.windowFrom + '~' + M.windowTo + ' (' + M.sessions + '거래일)';
if(M.provisional){
  var provSrc = M.provisional === 'yahoo-spark' ? ['야후 종가', '야후 차트(spark)'] : ['나스닥 스크리너', 'Nasdaq 스크리너'];
  $('#provBanner').innerHTML = '<div class="provbox"><b>잠정판 · ' + provSrc[0] + '</b> — 기준일 종가·거래량을 ' + provSrc[1] + '로 먼저 계산했습니다. '
    + '시가·고가·저가가 없어 <b>시초가 대비·저가→고가</b> 칸이 비어 있고, 한국시간 15:30 이후 Massive 확정판으로 교체됩니다.</div>';
}

var dup2 = DATA.highs.filter(function(r){return r.highCount>=2;}).length;
var dup4 = DATA.highs.filter(function(r){return r.highCount===4;}).length;
function cnt(lbl){ return DATA.highs.filter(function(r){ return r.highs.indexOf(lbl)>=0; }).length; }
var KPI = [
  ['신고가 합계', DATA.highs.length],
  ['52주', cnt('52주')], ['120일', cnt('120일')], ['60일', cnt('60일')], ['20일', cnt('20일')],
  ['중복 2개+', dup2], ['전 기간 4개', dup4],
  ['유니버스', M.passedUniverse], ['전체 스캔', M.scanned]
];
$('#kpis').innerHTML = KPI.map(function(k){
  return '<div class="kpi"><b>'+n(k[1],0)+'</b><span>'+esc(k[0])+'</span></div>'; }).join('');

// ── 탭 ───────────────────────────────────────────────────────
Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(b){
  b.addEventListener('click', function(){
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(x){
      x.setAttribute('aria-selected', String(x===b)); });
    ['high','rank','meta'].forEach(function(k){ $('#pane-'+k).hidden = (k!==b.dataset.tab); });
    if(b.dataset.tab==='high') drawChart();
  });
});

// ── 신고가 표 ────────────────────────────────────────────────
var COLS = [
  {k:'ticker', t:'티커', l:true, r:function(r){ return '<span class="tk">'+esc(r.ticker)+'</span>'; }},
  {k:'name', t:'회사명', l:true, r:function(r){ return '<span class="nm" title="'+esc(r.name)+'">'+esc(r.name)+'</span>'; }},
  {k:'sectorBig', t:'대섹터', l:true, r:function(r){
    return '<span class="secbig">'+esc(r.sectorBig||'미분류')+'</span>'; }},
  {k:'sectorSub', t:'소섹터', l:true, r:function(r){
    return '<span class="sec">'+esc(r.sectorSub||'—')+'</span>'; }},
  // 사업 설명 — "이게 무슨 회사이길래 신고가인가" 를 표에서 바로 읽게 한다.
  {k:'bizDesc', t:'사업', l:true, r:function(r){
    if(!r.bizDesc) return '<span class="sec">—</span>';
    return '<div class="biz" title="'+esc(r.bizDesc)+'">'+esc(r.bizDesc)+'</div>'; }},
  {k:'highSort', t:'신고가', l:true, r:highCell},
  {k:'marketCap', t:'시가총액', r:function(r){
    // ADR 은 'ADS 가격 × ADS 수' 라 본토 시가총액과 다를 수 있다.
    // SKHY 실측(2026-09-04): 여기 $1,256B vs KRX 기준 $864B — ADR 프리미엄 약 45%.
    var adr = r.type==='ADRC';
    var tip = adr ? 'ADR — ADS 가격 기준이라 본토 시가총액과 다를 수 있다 (교환 제한 시 프리미엄·디스카운트 유지)'
            : (r.capShared ? '복수 종류주식이 같은 CIK 를 쓴다 — SEC 주식수가 종류주식 합계일 수 있다' : '');
    var mark = adr ? '<span class="capwarn" title="'+esc(tip)+'">~</span>' : (r.capShared?'*':'');
    return '<span class="num"'+(tip&&!adr?' title="'+esc(tip)+'"':'')+'>'+money(r.marketCap)+mark+'</span>'; }},
  {k:'close', t:'종가', r:function(r){ return '<span class="num">'+n(r.close,2)+'</span>'; }},
  {k:'chgPct', t:'등락률', r:function(r){ return '<span class="num '+cls(r.chgPct)+'">'+pct(r.chgPct)+'</span>'; }},
  {k:'fromOpenPct', t:'시초가 대비', r:function(r){ return '<span class="num '+cls(r.fromOpenPct)+'">'+pct(r.fromOpenPct)+'</span>'; }},
  {k:'lowToHighPct', t:'저가→고가', r:function(r){ return '<span class="num">'+pct(r.lowToHighPct)+'</span>'; }},
  {k:'dollarVol', t:'거래대금', r:function(r){ return '<span class="num">'+money(r.dollarVol)+'</span>'; }},
  {k:'dvMult', t:'거래대금 배수', r:function(r){ return '<span class="num">'+(isFinite(r.dvMult)&&r.dvMult!==null?n(r.dvMult,2)+'x':'—')+'</span>'; }},
  {k:'exch', t:'거래소', r:function(r){ return '<span class="sec">'+esc({XNYS:'NYSE',XNAS:'NASDAQ',XASE:'AMEX'}[r.exch]||r.exch)+'</span>'; }},
  {k:'note', t:'비고', l:true, r:function(r){
    return '<div class="note" data-t="'+esc(r.ticker)+'"'+(r.noteSrc?' title="출처: '+esc(r.noteSrc)+'"':'')+'>'+esc(r.note||'')+'</div>'; }}
];

var CHIPS = [
  {k:'all', t:'전체'}, {k:'52주', t:'52주'}, {k:'120일', t:'120일'}, {k:'60일', t:'60일'}, {k:'20일', t:'20일'},
  {k:'dup2', t:'중복 2개+'}, {k:'dup4', t:'전 기간 4개'}, {k:'mult2', t:'거래대금 2배+'}, {k:'mine', t:'내 섹터만'}
];
var chipK = 'all', sortK = 'highSort', sortD = -1, qStr = '', secStr = '';

$('#hchips').innerHTML = CHIPS.map(function(c){
  return '<button class="chip" type="button" data-k="'+c.k+'" aria-pressed="'+(c.k==='all')+'">'+esc(c.t)+'</button>';
}).join('');
Array.prototype.forEach.call(document.querySelectorAll('#hchips .chip'), function(b){
  b.addEventListener('click', function(){
    chipK = b.dataset.k;
    Array.prototype.forEach.call(document.querySelectorAll('#hchips .chip'), function(x){
      x.setAttribute('aria-pressed', String(x===b)); });
    paint();
  });
});

var secs = {};
DATA.highs.forEach(function(r){ var k = r.sectorBig||'미분류'; secs[k] = (secs[k]||0)+1; });
$('#secSel').innerHTML = '<option value="">대섹터 전체</option>' + Object.keys(secs).sort(function(a,b){
  return secs[b]-secs[a] || a.localeCompare(b); }).map(function(s){
  return '<option value="'+esc(s)+'">'+esc(s)+' ('+secs[s]+')</option>'; }).join('');
$('#secSel').addEventListener('change', function(){ secStr = this.value; paint(); });
$('#q').addEventListener('input', function(){ qStr = this.value.trim().toUpperCase(); paint(); });

$('#htable thead').innerHTML = '<tr>' + COLS.map(function(c){
  return '<th class="'+(c.l?'l':'')+'" data-k="'+c.k+'">'+esc(c.t)+'<span class="ar">▼</span></th>'; }).join('') + '</tr>';
Array.prototype.forEach.call(document.querySelectorAll('#htable th'), function(th){
  th.addEventListener('click', function(){
    var k = th.dataset.k;
    if(sortK===k) sortD = -sortD; else { sortK = k; sortD = -1; }
    paint();
  });
});

function filtered(){
  return DATA.highs.filter(function(r){
    if(chipK==='dup2' && r.highCount<2) return false;
    if(chipK==='dup4' && r.highCount!==4) return false;
    if(chipK==='mult2' && !(r.dvMult>=2)) return false;
    if(chipK==='mine' && r.sectorSrc!=='sectors.json') return false;
    if(['52주','120일','60일','20일'].indexOf(chipK)>=0 && r.highs.indexOf(chipK)<0) return false;
    if(secStr && (r.sectorBig||'미분류')!==secStr) return false;
    if(qStr && (r.ticker.indexOf(qStr)<0 && String(r.name).toUpperCase().indexOf(qStr)<0)) return false;
    return true;
  });
}

var view = [];
function paint(){
  // sortD: 1=오름차순, -1=내림차순. 값이 없는 칸은 방향과 무관하게 항상 아래로 보낸다.
  view = filtered().sort(function(a,b){
    var x = a[sortK], y = b[sortK];
    if(typeof x === 'string' || typeof y === 'string')
      return String(x===null||x===undefined?'':x).localeCompare(String(y===null||y===undefined?'':y)) * sortD;
    var xa = (x===null||x===undefined||!isFinite(x)), ya = (y===null||y===undefined||!isFinite(y));
    if(xa && ya) return 0;
    if(xa) return 1;
    if(ya) return -1;
    return (x - y) * sortD;
  });
  Array.prototype.forEach.call(document.querySelectorAll('#htable th'), function(th){
    if(th.dataset.k===sortK){ th.dataset.dir = sortD>0?'asc':'desc'; th.querySelector('.ar').textContent = sortD>0?'▲':'▼'; }
    else { delete th.dataset.dir; th.querySelector('.ar').textContent = '▼'; }
  });
  $('#htable tbody').innerHTML = view.map(function(r){
    return '<tr>' + COLS.map(function(c){ return '<td class="'+(c.l?'l':'')+'">'+c.r(r)+'</td>'; }).join('') + '</tr>';
  }).join('') || '<tr><td class="l" colspan="'+COLS.length+'" style="padding:22px;color:var(--ink-3)">조건에 맞는 종목이 없습니다.</td></tr>';
  $('#hcount').textContent = n(view.length,0) + ' / ' + n(DATA.highs.length,0) + '종목';
  applyNotes();
  if(noteMode) enableNotes(true);
  drawChart();
}

// ── 비고 (브라우저에 저장. 내보내기로 notes.json 에 옮긴다) ──────
// 거래일별 키 — 매일 같은 링크에 새 날짜판이 올라오므로, 키를 하나로 두면 어제 이 브라우저에 적은
// 비고가 오늘 표의 같은 티커에 그대로 얹혀 "어제 재료" 가 오늘 것처럼 읽힌다. 옛 키는 지우지 않는다.
var NKEY = 'us-newhigh-notes-' + M.date;
// 브라우저·열람 방식에 따라 저장이 아예 막힌다(시크릿 창, data: URL, 사이트 데이터 차단).
// 막힌 걸 모르고 비고를 적으면 새로고침 한 번에 통째로 날아가므로 미리 알린다.
var STORAGE_OK = (function(){ try{ localStorage.setItem('__probe','1'); localStorage.removeItem('__probe'); return true; }catch(e){ return false; } })();
function loadNotes(){ try{ return JSON.parse(localStorage.getItem(NKEY)||'{}'); }catch(e){ return {}; } }
function saveNotes(o){ try{ localStorage.setItem(NKEY, JSON.stringify(o)); }catch(e){} }
function applyNotes(){
  var o = loadNotes();
  Array.prototype.forEach.call(document.querySelectorAll('.note'), function(el){
    if(o[el.dataset.t]) el.textContent = o[el.dataset.t];
  });
}
var noteMode = false;
function enableNotes(on){
  Array.prototype.forEach.call(document.querySelectorAll('.note'), function(el){
    if(on){ el.setAttribute('contenteditable','true');
      el.onblur = function(){ var o = loadNotes(); var v = el.textContent.trim();
        if(v) o[el.dataset.t] = v; else delete o[el.dataset.t]; saveNotes(o); };
    } else { el.removeAttribute('contenteditable'); el.onblur = null; }
  });
}
$('#noteBtn').addEventListener('click', function(){
  noteMode = !noteMode;
  this.setAttribute('aria-pressed', String(noteMode));
  this.textContent = noteMode ? '비고 편집 끄기' : '비고 편집';
  enableNotes(noteMode);
  var w = $('#noteWarn');
  w.hidden = !(noteMode && !STORAGE_OK);
  w.textContent = '이 브라우저에서 저장이 막혀 있습니다 — 적은 비고는 새로고침하면 사라집니다. CSV 로 내보내세요.';
});

// ── CSV (쉼표 없는 순수 숫자 — 엑셀이 숫자로 읽게) ───────────────
$('#csvBtn').addEventListener('click', function(){
  var o = loadNotes();
  var head = ['ticker','name','sectorBig','sectorSub','sic','sicDesc','highs','highCount','marketCap','shares',
              'close','prevClose','open','high','low','chgPct','fromOpenPct','lowToHighPct','volume','dollarVol',
              'dvMult','w52High','w52HighDate','exch','type','listDate','bizDesc','note'];
  var lines = [head.join(',')];
  view.forEach(function(r){
    lines.push(head.map(function(k){
      var v = (k==='highs') ? r.highs.join('|') : (k==='note' ? (o[r.ticker]||r.note||'') : r[k]);
      if(v===null||v===undefined) return '';
      v = String(v);
      return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
    }).join(','));
  });
  var blob = new Blob(['\ufeff'+lines.join('\n')], {type:'text/csv;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'us-newhigh-20261125.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
});

// ── 테마 ─────────────────────────────────────────────────────
// 현재 다크인지는 속성만 보면 안 된다. 속성이 없을 때(=OS 설정을 따를 때)를 놓치면
// 폰 다크 모드에서 버튼이 거꾸로 동작한다.
function isDark(){
  var a = document.documentElement.getAttribute('data-theme');
  if(a === 'dark') return true;
  if(a === 'light') return false;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
}
try{ var st = localStorage.getItem('us-newhigh-theme'); if(st) document.documentElement.setAttribute('data-theme', st); }catch(e){}
function syncThemeBtn(){ $('#themeBtn').textContent = isDark() ? '◐ 라이트' : '◐ 다크'; }
syncThemeBtn();
$('#themeBtn').addEventListener('click', function(){
  var t = isDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem('us-newhigh-theme', t); }catch(e){}
  syncThemeBtn(); drawChart();
});
// 뷰어가 바깥에서 테마를 바꾸거나 OS 설정이 바뀌면 버튼 라벨과 차트를 다시 맞춘다.
new MutationObserver(function(){ syncThemeBtn(); drawChart(); })
  .observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
if(window.matchMedia){
  var mq = window.matchMedia('(prefers-color-scheme: dark)');

// ── 산점도 (x: 거래대금 배수 log, y: 등락률) ────────────────────
var PTS = [];
function drawChart(){
  var svg = $('#chart');
  if(!svg || $('#pane-high').hidden) return;
  var W = svg.clientWidth || 900, H = 340;
  // 세로 밴드를 먼저 박는다. TITLE_Y(축 제목) 밴드와 T(플롯 상단) 밴드를 겹치게 두면
  // 맨 위 눈금 라벨이 축 제목을 먹는다.
  var TITLE_Y = 13, L = 62, R = 18, T = 34, B = 46;
  svg.setAttribute('viewBox', '0 0 '+W+' '+H);

  var src = (view.length?view:DATA.highs).filter(function(r){
    return isFinite(r.dvMult) && r.dvMult>0 && isFinite(r.chgPct); });
  if(!src.length){
    svg.innerHTML = '<text x="'+(W/2)+'" y="'+(H/2)+'" text-anchor="middle" fill="var(--ink-3)" font-size="13">'
      + '표시할 데이터가 없습니다</text>';
    PTS = []; return;
  }

  var xs = src.map(function(r){ return Math.log10(r.dvMult); });
  var ys = src.map(function(r){ return r.chgPct; });
  var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
  var y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  x0 = Math.min(x0, -0.31); x1 = Math.max(x1, 0.48);           // 0.5x ~ 3x 는 항상 보이게
  var yPad = Math.max(1, (y1-y0)*0.12); y0 -= yPad; y1 += yPad;
  if(y1-y0 < 2){ y0 -= 1; y1 += 1; }

  var px = function(v){ return L + (Math.log10(v)-x0)/(x1-x0)*(W-L-R); };
  var py = function(v){ return T + (y1-v)/(y1-y0)*(H-T-B); };

  var s = [];
  // 세로 격자 = 배수 눈금
  [0.5,1,2,3,5,10,20,50].forEach(function(m){
    var lx = Math.log10(m);
    if(lx < x0 || lx > x1) return;
    var X = px(m);
    s.push('<line x1="'+X.toFixed(1)+'" y1="'+T+'" x2="'+X.toFixed(1)+'" y2="'+(H-B)+'" stroke="var(--line-soft)" stroke-width="1"/>');
    s.push('<text x="'+X.toFixed(1)+'" y="'+(H-B+17)+'" text-anchor="middle" fill="var(--ink-3)" font-size="11" font-family="var(--mono)">'+m+'x</text>');
  });
  // 가로 격자 = 등락률 눈금 (5칸 고정 — 라벨끼리 절대 겹치지 않게)
  for(var i=0;i<=5;i++){
    var v = y0 + (y1-y0)*i/5, Y = py(v);
    s.push('<line x1="'+L+'" y1="'+Y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+Y.toFixed(1)+'" stroke="var(--line-soft)" stroke-width="1"/>');
    s.push('<text x="'+(L-9)+'" y="'+(Y+4).toFixed(1)+'" text-anchor="end" fill="var(--ink-3)" font-size="11" font-family="var(--mono)">'+v.toFixed(1)+'%</text>');
  }
  // 0% 기준선 · 1배 기준선
  if(y0<0 && y1>0) s.push('<line x1="'+L+'" y1="'+py(0).toFixed(1)+'" x2="'+(W-R)+'" y2="'+py(0).toFixed(1)+'" stroke="var(--ink-3)" stroke-width="1.4" stroke-dasharray="4 3"/>');
  s.push('<line x1="'+px(1).toFixed(1)+'" y1="'+T+'" x2="'+px(1).toFixed(1)+'" y2="'+(H-B)+'" stroke="var(--ink-3)" stroke-width="1.4" stroke-dasharray="4 3"/>');

  // 색을 토큰으로 준다 — 폰 OS 다크에서도 점 색이 따라온다.
  var COLOR = {'52주':'var(--dot52)','120일':'var(--dot120)','60일':'var(--dot60)','20일':'var(--dot20)'};
  PTS = [];
  src.forEach(function(r){
    var X = px(r.dvMult), Y = py(r.chgPct);
    PTS.push({x:X, y:Y, r:r});
    var c = COLOR[r.highLabel] || '#667085';
    s.push('<circle cx="'+X.toFixed(1)+'" cy="'+Y.toFixed(1)+'" r="'+(r.highCount>=3?5.5:4)+'" fill="'+c+'" fill-opacity="'+(r.highCount>=2?0.85:0.5)+'" stroke="'+c+'" stroke-width="1"/>');
  });

  // 축 제목 — 아래 여백 밴드에만 둔다 (눈금 라벨 밴드와 분리)
  s.push('<text x="'+((L+W-R)/2)+'" y="'+(H-7)+'" text-anchor="middle" fill="var(--ink-2)" font-size="11.5">거래대금 / 직전 20세션 중앙값 (로그)</text>');
  s.push('<text x="8" y="'+TITLE_Y+'" fill="var(--ink-2)" font-size="11.5">등락률 (%)</text>');
  s.push('<rect id="hit" x="'+L+'" y="'+T+'" width="'+(W-L-R)+'" height="'+(H-T-B)+'" fill="transparent"/>');
  s.push('<circle id="mk" r="8" fill="none" stroke="var(--accent)" stroke-width="2" style="display:none"/>');
  svg.innerHTML = s.join('');
  bindHover(svg);
}

function bindHover(svg){
  var tip = $('#tip'), mk = svg.querySelector('#mk'), hit = svg.querySelector('#hit');
  if(!hit) return;
  function at(ev){
    var t = (ev.touches && ev.touches[0]) || ev;
    var box = svg.getBoundingClientRect();
    var vb = svg.viewBox.baseVal;
    var sx = vb.width / box.width, sy = vb.height / box.height;
    var mx = (t.clientX - box.left) * sx, my = (t.clientY - box.top) * sy;
    var best = null, bd = Infinity;
    for(var i=0;i<PTS.length;i++){
      var d = (PTS[i].x-mx)*(PTS[i].x-mx) + (PTS[i].y-my)*(PTS[i].y-my);
      if(d < bd){ bd = d; best = PTS[i]; }
    }
    if(!best || bd > 40*40){ hide(); return; }
    mk.setAttribute('cx', best.x); mk.setAttribute('cy', best.y); mk.style.display = '';
    var r = best.r;
    tip.innerHTML = '<b>'+esc(r.ticker)+' · '+esc(r.name)+'</b>'
      + '<div class="row"><span>신고가</span><span>'+esc(r.highs.join(' · '))+'</span></div>'
      + '<div class="row"><span>등락률</span><span class="'+cls(r.chgPct)+'">'+pct(r.chgPct)+'</span></div>'
      + '<div class="row"><span>거래대금</span><span>'+money(r.dollarVol)+'</span></div>'
      + '<div class="row"><span>거래대금 배수</span><span>'+n(r.dvMult,2)+'x</span></div>'
      + '<div class="row"><span>종가</span><span>$'+n(r.close,2)+'</span></div>'
      + '<div class="row"><span>섹터</span><span>'+esc(r.sector)+'</span></div>'
      + '<div class="row" style="margin-top:5px;color:var(--ink-3)"><span>'+esc(M.date)+' 종가 기준</span><span></span></div>';
    tip.style.display = 'block';
    var tw = tip.offsetWidth, th = tip.offsetHeight;
    var lx = t.clientX + 16, ly = t.clientY + 16;
    if(lx + tw > window.innerWidth - 8) lx = t.clientX - tw - 16;
    if(ly + th > window.innerHeight - 8) ly = t.clientY - th - 16;
    tip.style.left = Math.max(8, lx) + 'px';
    tip.style.top = Math.max(8, ly) + 'px';
  }
  function hide(){ tip.style.display = 'none'; if(mk) mk.style.display = 'none'; }
  hit.addEventListener('mousemove', at);
  hit.addEventListener('mouseleave', hide);
  hit.addEventListener('touchstart', function(e){ at(e); }, {passive:true});
  hit.addEventListener('touchmove', function(e){ at(e); }, {passive:true});
  hit.addEventListener('touchend', hide);
}
window.addEventListener('resize', function(){ drawChart(); });

// ── 등락률 랭킹 ──────────────────────────────────────────────
var RCOLS = [
  {t:'#', r:function(r){ return '<span class="num">'+r.rankNo+'</span>'; }},
  {t:'티커', l:true, r:function(r){ return '<span class="tk">'+esc(r.ticker)+'</span>'; }},
  {t:'회사명', l:true, r:function(r){ return '<span class="nm" title="'+esc(r.name)+'">'+esc(r.name)+'</span>'; }},
  {t:'종가', r:function(r){ return '<span class="num">'+n(r.close,2)+'</span>'; }},
  {t:'등락률', r:function(r){ return '<span class="num '+cls(r.chgPct)+'">'+pct(r.chgPct)+'</span>'; }},
  {t:'시가총액', r:function(r){ return '<span class="num">'+money(r.marketCap)+'</span>'; }},
  {t:'거래대금', r:function(r){ return '<span class="num">'+money(r.dollarVol)+'</span>'; }},
  {t:'배수', r:function(r){ return '<span class="num">'+(isFinite(r.dvMult)&&r.dvMult!==null?n(r.dvMult,1)+'x':'—')+'</span>'; }}
];
var rAxis = 'cap';
function paintRank(){
  var gs = DATA.ranking.filter(function(g){ return g.axis===rAxis; });
  $('#rankGrid').innerHTML = gs.map(function(g){
    return '<div class="rk"><h3>'+esc(g.bucketLabel)+' · '+esc(g.sideLabel)
      + ' <em>'+n(g.universeCount,0)+'종목 중 상위 '+g.rows.length+' 선별</em></h3>'
      + '<div class="tw"><table><thead><tr>'
      + RCOLS.map(function(c){ return '<th class="'+(c.l?'l':'')+'" style="cursor:default">'+esc(c.t)+'</th>'; }).join('')
      + '</tr></thead><tbody>'
      + (g.rows.map(function(r){ return '<tr>' + RCOLS.map(function(c){
          return '<td class="'+(c.l?'l':'')+'">'+c.r(r)+'</td>'; }).join('') + '</tr>'; }).join('')
        || '<tr><td class="l" colspan="'+RCOLS.length+'" style="padding:18px;color:var(--ink-3)">해당 구간 종목 없음</td></tr>')
      + '</tbody></table></div></div>';
  }).join('');
  $('#rnote').textContent = rAxis==='cap'
    ? (M.capUnknownRankable ? '시총 미상 ' + n(M.capUnknownRankable,0) + '종목은 시총 구간에서 빠짐 — 거래대금 구간에서는 보입니다' : '')
    : '거래대금은 전 종목에 대해 항상 계산됩니다';
}
Array.prototype.forEach.call(document.querySelectorAll('#rchips .chip'), function(b){
  b.addEventListener('click', function(){
    rAxis = b.dataset.axis;
    Array.prototype.forEach.call(document.querySelectorAll('#rchips .chip'), function(x){
      x.setAttribute('aria-pressed', String(x===b)); });
    paintRank();
  });
});
paintRank();
